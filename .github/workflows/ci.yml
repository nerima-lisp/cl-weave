name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job on purpose. Granularity belongs in the flake's `checks.*`
  # attributes, which `nix flake check` evaluates in parallel with build
  # caching. Splitting these into separate GitHub jobs would duplicate that
  # scheduling and lose cache sharing between them.
  #
  # Add a second job ONLY for work the Nix sandbox cannot do: network access,
  # a real PTY/TTY, or artifact upload. "A different runner OS" is no longer
  # one of them: as of the 2026-08-01 revision flake.nix declares x86_64-linux
  # alone, so no other runner has an output to check.
  #
  # The one-element matrix that used to sit here is deleted rather than left in
  # place. A one-element matrix signals an intent to add a second platform, and
  # there is none. See PACKAGE_STANDARD.md "CI の粒度".
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # persist-credentials: false — this job runs untrusted PR code via
      # `nix flake check`, and never needs the token, so don't leave it in
      # .git/config for that code to read.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          # Never hand the push token to pull_request runs: a local `./` action is
          # resolved from the PR head, so gating here (not just inside the action)
          # keeps a same-repo PR from reading the secret. Empty token => pull-only.
          cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}

      # Runs the SBCL self-test suite (checks.default), the treefmt formatting
      # gate (checks.formatting), the mkdocs --strict build (checks.docs), and
      # the reporter/artifact contract checks.
      # No `--all-systems`. `systems` is a single element, so it would not
      # widen the check; and it realises derivations rather than merely
      # evaluating them, which is how a foreign attribute fails with "platform
      # mismatch" instead of being skipped.
      - name: Run flake checks
        timeout-minutes: 15
        # --max-jobs 2 tuned for the 16 GB GitHub-hosted runner: each SBCL check
        # caps at a 4 GB dynamic space, so two in parallel stay well within RAM.
        # Lower to 1 if OOM appears on a smaller runner.
        #
        # 900s, not 600s: pull_request runs never push to Cachix (see the
        # cachix-auth-token gating above), so every PR compiles paredit-cli's
        # Rust workspace from scratch. That release-profile LTO build alone
        # can take 6+ minutes on a cold cache, which pushed total step time
        # past 600s and timed out two consecutive PR runs after the v1.3.0
        # bump in PR #34.
        run: timeout 900s nix flake check --print-build-logs --max-jobs 2

      # Artifact upload is the one thing the Nix sandbox cannot do, so the
      # reporter outputs are realised here and handed to upload-artifact.
      - name: Materialize check artifacts
        timeout-minutes: 2
        run: |
          set -euo pipefail
          outputs="$(timeout 120s nix build --no-link --print-out-paths \
            ".#checks.x86_64-linux.json-results-artifact" \
            ".#checks.x86_64-linux.jsonl-events-artifact" \
            ".#checks.x86_64-linux.cli-json-results" \
            ".#checks.x86_64-linux.ai-metadata-artifact" \
            ".#checks.x86_64-linux.plan-artifact" \
            ".#checks.x86_64-linux.watch-once-artifact" \
            ".#checks.x86_64-linux.tap-artifact" \
            ".#checks.x86_64-linux.junit-artifact" \
            ".#checks.x86_64-linux.coverage-artifact")"
          while IFS= read -r output; do
            test -d "$output"
            cp -R "$output"/. .
          done <<< "$outputs"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cl-weave-test-reports-x86_64-linux
          path: |
            cl-weave-results.json
            cl-weave-events.jsonl
            cl-weave-cli-results.json
            cl-weave-metadata.json
            cl-weave-plan.json
            cl-weave-watch-once.json
            cl-weave-tap.txt
            cl-weave-junit.xml
            cl-weave.coverage
            cl-weave-coverage-report/
          if-no-files-found: error

      # Catches stray conflict markers and whitespace errors that compile fine.
      - name: Check diff hygiene
        run: git diff --check
