name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: nix (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 24
    strategy:
      fail-fast: false
      # Single active entry today. The flake exposes checks for every system in
      # `systems`, so covering another platform is a one-line addition here
      # (e.g. `{ system: aarch64-darwin, runner: macos-14 }`).
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Nix and Cachix
        uses: ./.github/actions/setup-nix-cachix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          # Never hand the push token to pull_request runs: a local `./` action is
          # resolved from the PR head, so gating here (not just inside the action)
          # keeps a same-repo PR from reading the secret. Empty token => pull-only.
          cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run flake checks
        timeout-minutes: 10
        # --max-jobs 2 tuned for the 16 GB GitHub-hosted runner: each SBCL check
        # caps at a 4 GB dynamic space, so two in parallel stay well within RAM.
        # Lower to 1 if OOM appears on a smaller runner.
        run: timeout 600s nix flake check --print-build-logs --max-jobs 2

      - name: Materialize check artifacts
        timeout-minutes: 2
        run: |
          set -euo pipefail
          outputs="$(timeout 120s nix build --no-link --print-out-paths \
            ".#checks.${{ matrix.system }}.json-results-artifact" \
            ".#checks.${{ matrix.system }}.jsonl-events-artifact" \
            ".#checks.${{ matrix.system }}.cli-json-results" \
            ".#checks.${{ matrix.system }}.ai-metadata-artifact" \
            ".#checks.${{ matrix.system }}.plan-artifact" \
            ".#checks.${{ matrix.system }}.watch-once-artifact" \
            ".#checks.${{ matrix.system }}.tap-artifact" \
            ".#checks.${{ matrix.system }}.junit-artifact" \
            ".#checks.${{ matrix.system }}.coverage-artifact")"
          while IFS= read -r output; do
            test -d "$output"
            cp -R "$output"/. .
          done <<< "$outputs"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cl-weave-test-reports-${{ matrix.system }}
          path: |
            cl-weave-results.json
            cl-weave-events.jsonl
            cl-weave-cli-results.json
            cl-weave-metadata.json
            cl-weave-plan.json
            cl-weave-watch-once.json
            cl-weave-tap.txt
            cl-weave-junit.xml
            cl-weave.coverage
            cl-weave-coverage-report/
          if-no-files-found: error
