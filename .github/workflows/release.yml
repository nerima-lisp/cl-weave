name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Create the GitHub Release and upload assets.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Enforces the org invariant "git tag == .asd :version" at the only point
      # where it can still be corrected cheaply. Without this gate the two drift
      # silently, which is how cl-boundary-kit reached :version 1.0.0 while its
      # newest tag was still v0.6.0.
      - name: Verify tag matches .asd version
        env:
          PACKAGE: cl-weave
        run: |
          set -euo pipefail
          asd_version="$(sed -n 's/^[[:space:]]*:version "\([^"]*\)".*/\1/p' "$PACKAGE.asd" | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "asd=$asd_version tag=$tag_version"
          if [[ "$asd_version" != "$tag_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $PACKAGE.asd version $asd_version" >&2
            exit 1
          fi

      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Never publish a release that does not pass its own test suite.
      - name: Verify the tagged tree
        run: nix flake check --print-build-logs --max-jobs 2

      - name: Build and bundle test report artifacts
        run: |
          set -euo pipefail
          outputs="$(timeout 600s nix build --no-link --print-out-paths \
            ".#checks.x86_64-linux.json-results-artifact" \
            ".#checks.x86_64-linux.jsonl-events-artifact" \
            ".#checks.x86_64-linux.cli-json-results" \
            ".#checks.x86_64-linux.ai-metadata-artifact" \
            ".#checks.x86_64-linux.plan-artifact" \
            ".#checks.x86_64-linux.watch-once-artifact" \
            ".#checks.x86_64-linux.tap-artifact" \
            ".#checks.x86_64-linux.junit-artifact" \
            ".#checks.x86_64-linux.coverage-artifact")"
          mkdir -p release-artifacts
          while IFS= read -r output; do
            test -d "$output"
            cp -R "$output"/. release-artifacts/
          done <<< "$outputs"
          tar -czf "cl-weave-test-reports-${GITHUB_REF_NAME}.tar.gz" -C release-artifacts .

      # Extracts this version's CHANGELOG section as the release body. Requires
      # the Keep a Changelog heading format `## [X.Y.Z] - YYYY-MM-DD`.
      - name: Extract release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for [$version]" >&2
            exit 1
          fi

      # Every `uses:` in this org references a 40-character SHA, never a mutable
      # tag. Re-resolve before bumping, and do not copy a SHA you have not
      # resolved yourself:
      #   gh api repos/softprops/action-gh-release/git/ref/tags/v3.0.2 --jq .object.sha
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: cl-weave-test-reports-${{ github.ref_name }}.tar.gz
