name: Update flake.lock

on:
  schedule:
    - cron: "0 4 * * 1" # 04:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write # Push the update branch.
  pull-requests: write # Open the update PR.

# Serialize a manual dispatch that overlaps the weekly schedule, so the two
# runs cannot open competing update PRs.
concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update:
    name: Update flake inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/nix-setup

      # The default token prevents the generated PR from recursively triggering CI.
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "chore: update flake.lock"
          commit-msg: "chore: update flake.lock"
