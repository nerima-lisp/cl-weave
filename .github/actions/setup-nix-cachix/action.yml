name: Set up Nix and Cachix
description: >-
  Install Nix (flakes enabled) and configure Cachix. Pushing is enabled only on
  non-pull_request events when an auth token is available; otherwise the cache is
  configured pull-only. Passing an empty cachix-cache skips Cachix entirely.

inputs:
  cachix-cache:
    description: Cachix cache name. Leave empty to skip Cachix configuration.
    required: false
    default: ""
  cachix-auth-token:
    description: >-
      Cachix auth token. When present on a non-pull_request event, binary
      pushing is enabled; otherwise the cache stays pull-only.
    required: false
    default: ""
  github-token:
    description: GitHub token forwarded to install-nix-action to avoid API rate limits.
    required: true

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      with:
        github_access_token: ${{ inputs.github-token }}
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Select Cachix mode
      id: cachix-mode
      if: ${{ inputs.cachix-cache != '' && github.event_name != 'pull_request' }}
      shell: bash
      env:
        CACHIX_AUTH_TOKEN: ${{ inputs.cachix-auth-token }}
      run: |
        if [[ -n "$CACHIX_AUTH_TOKEN" ]]; then
          printf '%s\n' 'push-enabled=true' >> "$GITHUB_OUTPUT"
        else
          printf '%s\n' 'push-enabled=false' >> "$GITHUB_OUTPUT"
        fi

    - name: Configure Cachix (pull-only)
      if: ${{ inputs.cachix-cache != '' && (github.event_name == 'pull_request' || steps.cachix-mode.outputs.push-enabled != 'true') }}
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      with:
        name: ${{ inputs.cachix-cache }}
        extraPullNames: nix-community
        skipPush: true

    - name: Configure Cachix (push-enabled)
      if: ${{ inputs.cachix-cache != '' && github.event_name != 'pull_request' && steps.cachix-mode.outputs.push-enabled == 'true' }}
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      with:
        name: ${{ inputs.cachix-cache }}
        authToken: ${{ inputs.cachix-auth-token }}
        extraPullNames: nix-community
