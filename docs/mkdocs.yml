# cl-weave documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build -f docs/mkdocs.yml --strict
# Serve:   mkdocs serve -f docs/mkdocs.yml --no-strict
# The Nix flake (`nix build .#docs`) drives the same config offline.

# Declared here as well as passed on the command line, so `mkdocs serve` uses
# the same gate and no call path can forget --strict.
strict: true

site_name: cl-weave
site_description: >-
  A modern Common Lisp testing framework inspired by Vitest — macros,
  conditions, dynamic bindings, and reproducible Nix workflows.
site_author: cl-weave contributors
site_url: https://nerima-lisp.github.io/cl-weave/

repo_name: nerima-lisp/cl-weave
repo_url: https://github.com/nerima-lisp/cl-weave
edit_uri: edit/main/docs/src/

# Content lives in docs/src (kept from the previous mdBook layout).
docs_dir: src
site_dir: ../site
use_directory_urls: true

copyright: Copyright &copy; cl-weave contributors — MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/vector-triangle
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nerima-lisp/cl-weave
      name: cl-weave on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  # Callouts / admonitions.
  - admonition
  - pymdownx.details
  # Code blocks: syntax highlighting, line numbers, inline highlighting.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # pymdownx.snippets is deliberately absent: its only use here was including
  # the top-level CHANGELOG.md, and the org abolished CHANGELOG.md in the
  # 2026-08-01 revision. Leaving the extension configured invites a new use.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content tabs (e.g. the Nix run / profile / local-checkout install paths).
  - pymdownx.tabbed:
      alternate_style: true
  # Task lists, key bindings, smart symbols.
  # pymdownx.emoji is deliberately absent: the docs standard forbids emoji, and
  # leaving the extension configured invites someone to conclude otherwise.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

# Five sections, in this order, per the org DOCS_STANDARD (2026-08-01 revision).
# Content lives in guide/, reference/ and project/; only index.md,
# getting-started.md and assets/ sit at the root of docs/src. The order follows
# the reader's state: Getting Started has not run anything yet, Guide has it
# working but does not know the design, Reference is looking up one answer,
# Project is about to contribute. Readership shrinks down the list, so
# reference sits at the back.
#
# --strict fails the build on a page that is not listed here, which is the point:
# the nav cannot silently fall behind docs/src/.
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - Adoption Guide: guide/adoption.md
      - DSL Guide: guide/dsl-guide.md
      - Assertions and Matchers: guide/assertions.md
      - Property Testing: guide/property-testing.md
      - Mutation Testing: guide/mutation-testing.md
      - Mocking: guide/mocking.md
      - Benchmarking: guide/benchmarking.md
      - Test Execution: guide/test-execution.md
      - Logic Programming: guide/logic-programming.md
      - Time-Travel Debugging: guide/time-travel-debugging.md
      - Reporters and CI: guide/reporters-and-ci.md
      - AI Discovery: guide/ai-discovery.md
  - Reference:
      - API: reference/api.md
      - AI Contract: reference/ai-contract.md
      - Runtime Support: reference/runtime-support.md
      - Doctor Report: reference/doctor-report.md
  - Project:
      - Development: project/development.md
      - Project Scope: project/project-scope.md
      - Community Health: project/community-health.md
      - Governance: project/governance.md
      - Triage Policy: project/triage-policy.md
      - Issue Reporting Guide: project/issue-reporting.md
      - Pull Request Guide: project/pull-request-template.md
      - Support Policy: project/support-policy.md
      - Versioning Policy: project/versioning-policy.md
      - Maintenance Policy: project/maintenance-policy.md
      - Distribution Policy: project/distribution-policy.md
      - Release Process: project/release-process.md

# Working notes and audit records go under docs/notes/ and stay off the site.
# Without this declaration --strict fails the moment such a file is added.
not_in_nav: |
  notes/
