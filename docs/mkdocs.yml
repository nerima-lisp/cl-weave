# cl-weave documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build -f docs/mkdocs.yml --strict
# Serve:   mkdocs serve -f docs/mkdocs.yml --no-strict
# The Nix flake (`nix build .#docs`) drives the same config offline.

# Declared here as well as passed on the command line, so `mkdocs serve` uses
# the same gate and no call path can forget --strict.
strict: true

site_name: cl-weave
site_description: >-
  A modern Common Lisp testing framework inspired by Vitest — macros,
  conditions, dynamic bindings, and reproducible Nix workflows.
site_author: cl-weave contributors
site_url: https://nerima-lisp.github.io/cl-weave/

repo_name: nerima-lisp/cl-weave
repo_url: https://github.com/nerima-lisp/cl-weave
edit_uri: edit/main/docs/src/

# Content lives in docs/src (kept from the previous mdBook layout).
docs_dir: src
site_dir: ../site
use_directory_urls: true

copyright: Copyright &copy; cl-weave contributors — MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/vector-triangle
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nerima-lisp/cl-weave
      name: cl-weave on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  # Callouts / admonitions.
  - admonition
  - pymdownx.details
  # Code blocks: syntax highlighting, line numbers, inline highlighting.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # pymdownx.snippets is deliberately absent: its only use here was including
  # the top-level CHANGELOG.md, and the org abolished CHANGELOG.md in the
  # 2026-08-01 revision. Leaving the extension configured invites a new use.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content tabs (e.g. the Nix run / profile / local-checkout install paths).
  - pymdownx.tabbed:
      alternate_style: true
  # Task lists, key bindings, smart symbols.
  # pymdownx.emoji is deliberately absent: the docs standard forbids emoji, and
  # leaving the extension configured invites someone to conclude otherwise.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

# Six sections, in this order, per the org docs standard. The order follows the
# reader's state: Getting Started has not run anything yet, Guide has it working
# but does not know the design, Reference is looking up one answer, Internals is
# about to change the implementation, Project is about to contribute. Readership
# shrinks down the list, so reference and internals sit at the back.
#
# --strict fails the build on a page that is not listed here, which is the point:
# the nav cannot silently fall behind docs/src/.
nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quick-start.md
      - Adoption Guide: adoption.md
  - Guide:
      - DSL Guide: dsl-guide.md
      - Assertions and Matchers: assertions.md
      - Property Testing: property-testing.md
      - Mutation Testing: mutation-testing.md
      - Mocking: mocking.md
      - Benchmarking: benchmarking.md
      - Test Execution: test-execution.md
      - Logic Programming: logic-programming.md
      - Time-Travel Debugging: time-travel-debugging.md
      - Reporters and CI: reporters-and-ci.md
      - AI Discovery: ai-discovery.md
  - Reference:
      - API Reference: api-reference.md
      - AI Contract: ai-contract.md
      - Runtime Support: runtime-support.md
      - Doctor Report: doctor-report.md
  - Internals:
      - Project Scope: project-scope.md
      - Community Health: community-health.md
  - Project:
      - Development: development.md
      - Governance: governance.md
      - Triage Policy: triage-policy.md
      - Issue Reporting Guide: issue-reporting.md
      - Pull Request Guide: pull-request-template.md
      - Support Policy: support-policy.md
      - Versioning Policy: versioning-policy.md
      - Maintenance Policy: maintenance-policy.md
      - Distribution Policy: distribution-policy.md
      - Release Process: release-process.md

# Working notes and audit records go under docs/notes/ and stay off the site.
# Without this declaration --strict fails the moment such a file is added.
not_in_nav: |
  notes/
